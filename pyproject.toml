[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qkrun"
dynamic = ["version"]
description = "A CLI tool for quick tasks."
readme = "README.md"
authors = [
    { name = "Adrian Martinez Rodriguez", email = "adrianmrit@gmail.com" }
]
license = { file = "LICENSE" }
keywords = ["CLI", "quick", "tasks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.12"
dependencies=[
    "frozendict>=2.5",
    "oslex>=2.0",
    "python-dotenv>=1.2",
    "rich>=15.0",
    "argcomplete>=3.7",
    # Watchdog 7.1 fails/hangs native macOS watcher regression tests.
    "watchdog>=6,<7",
]

[project.urls]
Homepage = "https://github.com/adrianmrit/qkrun"
Documentation = "https://qkrun.readthedocs.io"
Repository = "https://github.com/adrianmrit/qkrun.git"
Issues = "https://github.com/adrianmrit/qkrun/issues"
Changelog = "https://github.com/adrianmrit/qkrun/blob/main/CHANGELOG.md"

[project.optional-dependencies]

[project.scripts]
"qk" = "qkrun._cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/qkrun"]

[tool.hatch.version]
path = "src/qkrun/_meta.py"

[tool.hatch.build]
exclude = ["_qk"]

[tool.pytest.ini_options]
addopts = ["-vv"]
markers = [
    "unit",
    "integration",
    "anyio"
]
python_files = "tests/*.py"
mock_use_standalone_module = true

[tool.coverage.run]
source = ["src/qkrun"]
omit = [
    "tests/*",
    "_qk/*"
]

[tool.ruff]

[tool.ruff.lint]
select = [
    "PL",  # pylint
    "E",   # pycodestyle
    "F",   # pyflakes
    "D",   # pydocstyle
]
fixable = ["ALL"]
ignore = ["D106", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[dependency-groups]
dev = [
    "sphinx>=9.1",
    "sphinx-rtd-theme>=3.1",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-mock>=3.17",
    "pre-commit>=4.7",
    "mock>=5.2",
    "twine>=7.0",
    "build>=1.6",
    "ruff>=0.17",
]
